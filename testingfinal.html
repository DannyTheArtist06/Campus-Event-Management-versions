<!DOCTYPE html>
<html>
<head>
    <title>Campus Event Management</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #eef2f7; color: #222; }
        .image { display: block; margin: 10px auto; }
        .top-nav { background: #173b70; color: white; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; }
        .main-container { width: 92%; max-width: 850px; margin: 15px auto; }
        .card, fieldset, .box { background: white; border: 1px solid #ccc; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        legend, h2, h3 { color: #173b70; font-weight: bold; }
        legend { font-size: 15px; padding: 0 6px; }
        label { display: block; font-weight: bold; font-size: 13px; margin: 5px 0 2px; }
        input, select, textarea { width: 100%; padding: 7px 9px; margin-bottom: 8px; border: 1px solid #bbb; border-radius: 4px; font-size: 13px; }
        .btn { background: #245a9b; color: white; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; margin: 3px 3px 3px 0; }
        .btn:hover:not(:disabled) { background: #12365f; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .btn-green { background: #27ae60; } .btn-green:hover { background: #1e8449; }
        .btn-red { background: #c0392b; } .btn-red:hover { background: #962d22; }
        .btn-gray { background: #6c757d; }
        .status-bar { text-align: center; font-size: 13px; color: #444; margin: 4px 0; font-weight: bold; }
        .event-card { background: #fff; border: 1px solid #bbb; border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
        .event-header { background: #f8faff; padding: 8px 12px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .event-box { padding: 10px 12px; border-bottom: 1px solid #eee; background: #fafafa; }
        .event-banner { width: 100%; height: 85px; background: #245a9b; color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; border-radius: 4px; margin-bottom: 8px; }
        .event-details { padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .time-pill { background: #eef2f7; border: 1px solid #ccd6e0; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #173b70; font-weight: bold; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-green { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .badge-red { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .badge-grey { background: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        .card-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
        .mini-card { min-width: 220px; background: #f8faff; border: 1px solid #245a9b; border-radius: 5px; padding: 10px; flex-shrink: 0; }
        .empty-msg { text-align: center; padding: 25px 15px; background: white; border: 1px dashed #aaa; border-radius: 6px; margin: 10px 0; }
        .modal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 99; }
        .modal-card { background: white; width: 92%; max-width: 460px; padding: 16px; border-radius: 6px; max-height: 90vh; overflow-y: auto; }
        .ticket-slip { border: 2px dashed #173b70; padding: 12px; background: #fdfdfd; margin-top: 8px; }
        .ticket-slip table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
        .ticket-slip td { padding: 4px; }
        .row { display: flex; gap: 10px; } .row > div { flex: 1; }
        @media print { body * { visibility: hidden; } #slip_content, #slip_content * { visibility: visible; } #slip_content { position: absolute; left: 0; top: 0; width: 100%; } }
    </style>
</head>

<body>
    <div class="top-nav">
        <div>
            <h2 style="color:white; font-size:18px;">Campus Event Management</h2>
            <p style="font-size:11px; opacity:0.85;">Discover. Participate. Enjoy.</p>
        </div>
        <button id="logout_btn" class="btn btn-gray" style="display:none;" onclick="logout()">Back / Logout</button>
    </div>

    <img class="image" src="LPU.png" alt="LPU Logo" width="160" height="80" onerror="this.style.display='none'">

    <div class="main-container">
        <p id="demo" class="status-bar"></p>
        <p id="demo_2" style="text-align:center; color:#245a9b; font-weight:bold;"></p>
        <hr style="margin: 8px 0 14px 0;">

        <!-- 000: Please Select Your Position -->
        <form id="000">
            <fieldset>
                <legend>Please Select Your Position</legend><br>
                <select id="select">
                    <option value="null">Select</option>
                    <option value="001">Student</option>
                    <option value="002">Organizer</option>
                </select>
                <br><br>
                <button type="submit" class="btn">Continue</button>
            </fieldset>
        </form>

        <!-- 100: Login Part -->
        <div style="display: none" id="100" class="box">
            <form id="login">
                <h3>Login to Portal</h3><br>
                <label>Registration Number: <input type="text" id="110" name="registration_number" placeholder="Enter Registration No." required></label><br>
                <label>Password: <input type="password" id="120" name="password" placeholder="Enter Password" required></label><br>
                <button type="submit" id="130" class="btn">Confirm</button>
                <button type="button" class="btn btn-gray" onclick="go_back()">Back</button>
            </form>
        </div>

        <!-- 200: Student Dashboard & Registration -->
        <div style="display: none" id="200">
            <!-- Participated Events (Image 4) -->
            <div class="box">
                <h3>🎟️ Participated Events</h3>
                <div id="participated_events" class="card-row"></div>
            </div>

            <!-- Available Events (Wireframe Image 5 & 1) -->
            <div class="box">
                <h3>📅 Available Events</h3>
                <div id="student_event_list"></div>
            </div>

            <!-- Registration Modal (Requirement 1: Opens ONLY when clicking Participate) -->
            <div id="student_reg_box" style="display:none;" class="modal-bg">
                <div class="modal-card">
                    <h3>Event Participation</h3>
                    <p id="reg_modal_info" style="font-size:12px; color:#555; margin:6px 0 10px 0;"></p>
                    <form id="student_registration">
                        <label>Name: <input type="text" id="210" name="Name" required></label>
                        <label>Registration Number: <input type="text" id="220" name="registration_number" required></label>
                        <div class="row">
                            <div><label>Age: <input type="number" id="250" name="age" min="15" required></label></div>
                            <div><label>Phone Number: <input type="number" id="230" name="phone_number" required></label></div>
                        </div>
                        <label>Qualification: <input type="text" id="240" name="qualification" required></label>
                        <label>Proof of Qualification (Optional): <input type="text" id="260" name="proof" placeholder="ID / Roll slip"></label>
                        <button type="submit" class="btn btn-green">Submit</button>
                        <button type="button" class="btn btn-gray" onclick="close_reg_form()">Cancel</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 300: Organizer Part (Choose Type) -->
        <div style="display: none" id="300" class="box">
            <form id="organizer_choose">
                <fieldset>
                    <legend>Choose</legend><br>
                    <select id="select_2">
                        <option value="null">Select</option>
                        <option value="301">Create Event</option>
                        <option value="302">Check Event</option>
                    </select>
                    <br><br>
                    <button type="submit" class="btn">Submit</button>
                    <button type="button" class="btn btn-gray" onclick="go_back()">Back</button>
                </fieldset>
            </form>
        </div>

        <!-- 400: Creating Event (Number input, Date & Timing) -->
        <div style="display: none" id="400" class="box">
            <form id="organizer_form">
                <h3>Create Event (Leader Mode)</h3><br>
                <label>Type / Name of Event: <input type="text" id="410" name="type_of_event" required></label>
                <label>Description: <textarea id="420" rows="3" name="description" required></textarea></label>
                <div class="row">
                    <div><label>Venue: <input type="text" id="430" name="venue" required></label></div>
                    <div><label>Eligibility Criteria: <input type="text" id="440" name="eligibility_criteria" required></label></div>
                </div>
                <div class="row">
                    <div><label>📅 Event Date: <input type="date" id="450" name="event_date" required></label></div>
                    <div><label>⏰ Event Timing: <input type="time" id="460" name="event_time" required></label></div>
                </div>
                <label>Registration Deadline: <input type="date" id="451" name="registration_to" required></label>
                <label for="limit">Registration limit: <input type="number" id="limit" min="1" placeholder="e.g. 50" name="Registration_limit" required></label>
                <label>Unique Code: <input type="number" id="480" maxlength="10" name="unique_code" required></label>
                <button type="submit" class="btn btn-green">Submit</button>
                <button type="button" class="btn btn-gray" onclick="show_organizer_menu()">Cancel</button>
            </form>
        </div>

        <!-- 500: Check Event / Manage -->
        <div style="display: none" id="500" class="box">
            <form id="checking_my_events">
                <h3>Check Event by Unique Code</h3><br>
                <label>Enter Unique Code: <input type="number" id="510" name="unique_code" required></label><br>
                <button type="submit" class="btn">Submit</button>
                <button type="button" class="btn btn-gray" onclick="show_organizer_menu()">Back</button>
            </form>
            <div id="organizer_event_details" style="margin-top:15px;"></div>
        </div>

        <!-- Slip Modal (Image 2) -->
        <div id="slip_modal" style="display:none;" class="modal-bg">
            <div class="modal-card">
                <h3>Campus Event Pass</h3>
                <div id="slip_content"></div>
                <button class="btn" onclick="window.print()">Print Slip</button>
                <button class="btn btn-gray" onclick="close_slip()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let a = document.getElementById('limit');
        let b = document.getElementById('470');
        if (a && b) { a.oninput = function() { b.textContent = this.value; }; }

        let selected_event_id = null;
        let current_logged_reg = "";

        // Form navigation logic (Preserving Durjay's original structure)
        document.getElementById('000').addEventListener('submit', function(e){
            e.preventDefault();
            let select = document.getElementById('select');
            let position = select.value;
            if (position === '001' || position === '002'){
                document.getElementById('000').style.display = "none";
                document.getElementById('100').style.display = "block";
                document.getElementById('logout_btn').style.display = "inline-block";
            } else {
                alert("Please select a position.");
            }
        });

        // Durjay's Storage Helpers
        function get_saved_data(storage_key){
            let saved_data = localStorage.getItem(storage_key);
            return saved_data ? JSON.parse(saved_data) : [];
        }

        function save_data(storage_key, form_values){
            let saved_data = get_saved_data(storage_key);
            saved_data.push(form_values);
            localStorage.setItem(storage_key, JSON.stringify(saved_data));
        }

        function update_stats() {
            let s_count = get_saved_data('student_registrations').length;
            let e_count = get_saved_data('events').length;
            document.getElementById('demo').innerHTML = "Total Student Registrations: " + s_count + " | Total Events Created: " + e_count;
        }
        update_stats();

        // Timezone-safe local calendar helper
        function get_today() {
            let d = new Date(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
            return `${d.getFullYear()}-${m}-${day}`;
        }

        // Formats "14:30" to "02:30 PM" (Requirement 3: Where is timing that I added)
        function format_time(t) {
            if (!t) return "Time TBA";
            let p = t.split(":"), h = parseInt(p[0], 10), m = p[1], ampm = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        }

        function escape_text(str) {
            return String(str || "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        // Login Handler
        document.getElementById('login').addEventListener('submit', function(e){
            e.preventDefault();
            let position = document.getElementById('select').value;
            current_logged_reg = document.getElementById('110').value.trim();
            let pass = document.getElementById('120').value.trim();

            if (!current_logged_reg || !pass) { alert("Please enter credentials."); return; }

            document.getElementById('100').style.display = "none";

            if (position === '001') {
                document.getElementById('200').style.display = "block";
                document.getElementById('220').value = current_logged_reg;
                render_student_dashboard();
            } else if (position === '002') {
                document.getElementById('300').style.display = "block";
            }
        });

        function go_back() {
            document.getElementById('100').style.display = "none";
            document.getElementById('200').style.display = "none";
            document.getElementById('300').style.display = "none";
            document.getElementById('400').style.display = "none";
            document.getElementById('500').style.display = "none";
            document.getElementById('000').style.display = "block";
            document.getElementById('logout_btn').style.display = "none";
            document.getElementById('demo_2').innerHTML = "";
        }
        function logout() { go_back(); }

        // Organizer Choose Menu
        document.getElementById('organizer_choose').addEventListener('submit', function(e){
            e.preventDefault();
            let pos = document.getElementById('select_2').value;
            if (pos === '301'){
                document.getElementById('300').style.display = "none";
                document.getElementById('400').style.display = "block";
            } else if (pos === '302'){
                document.getElementById('300').style.display = "none";
                document.getElementById('500').style.display = "block";
                render_all_organizer_events();
            } else {
                alert("Please select an option.");
            }
        });

        function show_organizer_menu() {
            document.getElementById('400').style.display = "none";
            document.getElementById('500').style.display = "none";
            document.getElementById('300').style.display = "block";
        }

        // Creating Event Form (Requirement 4: Saves properly and displays to students)
        document.getElementById('organizer_form').addEventListener('submit', function(e){
            e.preventDefault();
            let ev_date = document.getElementById('450').value;
            let ev_deadline = document.getElementById('451').value;
            let today = get_today();

            if (ev_date < today || ev_deadline < today) {
                alert("Event date and registration deadline cannot be in the past.");
                return;
            }
            if (ev_deadline > ev_date) {
                alert("Registration deadline cannot be after the event date.");
                return;
            }

            let new_event = {
                id: "ev-" + Date.now(),
                type_of_event: document.getElementById('410').value.trim(),
                description: document.getElementById('420').value.trim(),
                venue: document.getElementById('430').value.trim(),
                eligibility_criteria: document.getElementById('440').value.trim(),
                event_date: ev_date,
                event_time: document.getElementById('460').value,
                registration_to: ev_deadline,
                Registration_limit: Number(document.getElementById('limit').value),
                unique_code: document.getElementById('480').value.trim(),
                ended: false
            };

            save_data('events', new_event);
            alert("Event Created Successfully! Students can now see and participate in this event.");
            document.getElementById('organizer_form').reset();
            if (b) b.textContent = "50";
            update_stats();
            show_organizer_menu();
        });

        // Student Dashboard (Participated & Available)
        function render_student_dashboard() {
            let events = get_saved_data('events');
            let student_regs = get_saved_data('student_registrations');

            // 1. Participated Events Row (Image 4)
            let p_div = document.getElementById('participated_events');
            p_div.innerHTML = "";
            let my_events = student_regs.filter(s => String(s.registration_number).toLowerCase() === current_logged_reg.toLowerCase());

            if (my_events.length === 0) {
                p_div.innerHTML = "<p style='font-size:12px; color:#666;'>You have not participated in any event yet.</p>";
            } else {
                my_events.forEach(item => {
                    let card = document.createElement("div");
                    card.className = "mini-card";
                    card.innerHTML = `
                        <b>${escape_text(item.event_name)}</b>
                        <p style="font-size:11px; margin:4px 0;">Seat: <b>${escape_text(item.seat_number)}</b></p>
                        <p style="font-size:11px; color:#555;">📅 ${item.event_date} | ⏰ ${format_time(item.event_time)}</p>
                        <div style="margin-top:6px;">
                            <button class="btn" style="font-size:11px; padding:3px 6px;" onclick="view_slip('${item.id}')">View Slip</button>
                            <button class="btn btn-red" style="font-size:11px; padding:3px 6px;" onclick="quit_event('${item.id}')">Quit</button>
                        </div>
                    `;
                    p_div.appendChild(card);
                });
            }

            // 2. Available Events (Requirement 2 & Wireframe Image 5 & 1)
            let e_div = document.getElementById('student_event_list');
            e_div.innerHTML = "";

            if (events.length === 0) {
                // Requirement 2: If no event exist, just show "Come back later!"
                e_div.innerHTML = `
                    <div class="empty-msg">
                        <h3>Come back later!</h3>
                        <p>No campus events are currently available for registration.</p>
                    </div>
                `;
                return;
            }

            events.forEach(ev => {
                let count = student_regs.filter(s => s.event_id === ev.id).length;
                let limit = Number(ev.Registration_limit) || 0;
                let is_full = limit > 0 && count >= limit;
                let is_ended = ev.ended === true;

                let badge_class = is_ended ? "badge-grey" : (is_full ? "badge-red" : "badge-green");
                let badge_text = is_ended ? "Ended" : (is_full ? "Full" : `${limit - count} Seats Available`);

                let card = document.createElement("div");
                card.className = "event-card";
                card.innerHTML = `
                    <div class="event-header">
                        <b>${escape_text(ev.type_of_event)}</b>
                        <span style="font-size:11px; color:#555;">📍 ${escape_text(ev.venue)}</span>
                    </div>
                    <div class="event-box">
                        <div class="event-banner">CAMPUS EVENT</div>
                        <p style="font-size:12px; color:#444; margin-bottom:4px;">${escape_text(ev.description)}</p>
                        <p style="font-size:11px; color:#666;"><b>Eligibility:</b> ${escape_text(ev.eligibility_criteria)}</p>
                    </div>
                    <div class="event-details">
                        <div class="time-pill">
                            📅 ${ev.event_date} &nbsp;|&nbsp; ⏰ ${format_time(ev.event_time)}
                        </div>
                        <div>
                            <span class="status-badge ${badge_class}">${badge_text}</span>
                            <button class="btn btn-green" ${is_ended || is_full ? "disabled" : ""} onclick="open_reg_form('${ev.id}')">
                                ${is_ended ? "Ended" : (is_full ? "Full" : "Participate")}
                            </button>
                        </div>
                    </div>
                `;
                e_div.appendChild(card);
            });
        }

        // Requirement 1: Only open registration when clicking Participate
        function open_reg_form(event_id) {
            let events = get_saved_data('events');
            let ev = events.find(e => e.id === event_id);
            if (!ev || ev.ended) { alert("This event is not available."); return; }

            selected_event_id = event_id;
            document.getElementById('reg_modal_info').innerHTML = `
                <b>Event:</b> ${escape_text(ev.type_of_event)}<br>
                <b>Schedule:</b> 📅 ${ev.event_date} at ⏰ ${format_time(ev.event_time)}<br>
                <b>Venue:</b> ${escape_text(ev.venue)}
            `;
            document.getElementById('220').value = current_logged_reg;
            document.getElementById('student_reg_box').style.display = "flex";
        }

        function close_reg_form() {
            selected_event_id = null;
            document.getElementById('student_reg_box').style.display = "none";
        }

        // Student Registration Submission
        document.getElementById('student_registration').addEventListener('submit', function(e){
            e.preventDefault();
            if (!selected_event_id) { alert("Please select an event first."); return; }
            let ev = get_saved_data('events').find(e => e.id === selected_event_id);
            let regs = get_saved_data('student_registrations');
            let s_reg = document.getElementById('220').value.trim(), s_name = document.getElementById('210').value.trim();
            let s_age = document.getElementById('250').value.trim(), s_phone = document.getElementById('230').value.trim();
            let s_qual = document.getElementById('240').value.trim(), s_proof = document.getElementById('260').value.trim();

            if (regs.some(s => s.event_id === ev.id && String(s.registration_number).toLowerCase() === s_reg.toLowerCase())) {
                alert("You have already registered for this event!"); return;
            }
            let count = regs.filter(s => s.event_id === ev.id).length;
            if (count >= Number(ev.Registration_limit)) {
                alert("Registration limit has been reached!"); close_reg_form(); render_student_dashboard(); return;
            }

            let new_reg = {
                id: "reg-" + Date.now(), event_id: ev.id, event_name: ev.type_of_event, event_date: ev.event_date,
                event_time: ev.event_time, event_venue: ev.venue, seat_number: "SEAT-" + (count + 1),
                Name: s_name, registration_number: s_reg, age: s_age, phone_number: s_phone, qualification: s_qual, proof: s_proof || "N/A"
            };

            save_data('student_registrations', new_reg);
            alert(`Registration Successful!\nYour Assigned Seat: ${new_reg.seat_number}`);
            close_reg_form(); update_stats(); render_student_dashboard(); view_slip(new_reg.id);
        });

        // Quit Participation (Image 4: Quit -> Yes/No)
        function quit_event(reg_id) {
            if (confirm("Are you sure you want to quit this event? (Quit -> Yes/No)")) {
                save_data_replace('student_registrations', get_saved_data('student_registrations').filter(s => s.id !== reg_id));
                alert("You have quit the event."); update_stats(); render_student_dashboard();
            }
        }
        function save_data_replace(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

        // Printable Slip (Image 2)
        function view_slip(reg_id) {
            let item = get_saved_data('student_registrations').find(s => s.id === reg_id);
            if (!item) return;
            document.getElementById('slip_content').innerHTML = `
                <div class="ticket-slip">
                    <h4 style="color:#173b70; text-align:center;">CAMPUS EVENT PARTICIPATION PASS</h4>
                    <p style="text-align:center; font-weight:bold; color:#245a9b; margin:4px 0;">${escape_text(item.event_name)}</p>
                    <table>
                        <tr><td><b>Seat Number:</b></td><td><span class="time-pill">${escape_text(item.seat_number)}</span></td></tr>
                        <tr><td><b>Participant Name:</b></td><td>${escape_text(item.Name)} (${escape_text(item.registration_number)})</td></tr>
                        <tr><td><b>Event Date:</b></td><td>${item.event_date}</td></tr>
                        <tr><td><b>Event Timing:</b></td><td>${format_time(item.event_time)}</td></tr>
                        <tr><td><b>Venue:</b></td><td>${escape_text(item.event_venue)}</td></tr>
                        <tr><td><b>Contact:</b></td><td>${escape_text(item.phone_number)}</td></tr>
                    </table>
                </div>
            `;
            document.getElementById('slip_modal').style.display = "flex";
        }
        function close_slip() { document.getElementById('slip_modal').style.display = "none"; }

        // Check Event by Unique Code (Durjay's original feature upgraded)
        document.getElementById('checking_my_events').addEventListener('submit', function(e){
            e.preventDefault();
            let code = document.getElementById('510').value.trim();
            let saved_events = get_saved_data('events');
            let found = saved_events.find(ev => String(ev.unique_code) === code);
            let detail_div = document.getElementById('organizer_event_details');

            if (found){
                document.getElementById('demo_2').innerHTML = "Event Found: " + escape_text(found.type_of_event);
                render_event_roster(found, detail_div);
            } else {
                document.getElementById('demo_2').innerHTML = "Event Not Found!";
                detail_div.innerHTML = "<p style='color:red; font-size:12px;'>No event matching this code.</p>";
            }
        });

        function render_all_organizer_events() {
            let saved_events = get_saved_data('events');
            let detail_div = document.getElementById('organizer_event_details');
            if (saved_events.length === 0) {
                detail_div.innerHTML = "<p style='color:#666; font-size:12px;'>No events created yet.</p>";
                return;
            }
            detail_div.innerHTML = "<h4 style='margin:10px 0 6px;'>All Events Created:</h4>";
            saved_events.forEach(ev => render_event_roster(ev, detail_div));
        }

        function render_event_roster(ev, container) {
            let regs = get_saved_data('student_registrations').filter(s => s.event_id === ev.id);
            let card = document.createElement("div");
            card.className = "card";
            card.style.margin = "10px 0";
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <b>${escape_text(ev.type_of_event)} (Code: ${escape_text(ev.unique_code)})</b>
                    <span class="status-badge ${ev.ended ? 'badge-grey' : 'badge-green'}">${ev.ended ? "Ended" : "Active"}</span>
                </div>
                <p style="font-size:12px; margin:4px 0;">📅 ${ev.event_date} | ⏰ ${format_time(ev.event_time)} | 📍 ${escape_text(ev.venue)}</p>
                <p style="font-size:12px;">Registered Students: <b>${regs.length} / ${ev.Registration_limit}</b></p>
                <div style="margin:6px 0;">
                    <button class="btn btn-red" style="font-size:11px; padding:3px 6px;" onclick="end_event('${ev.id}')">End Event</button>
                    <button class="btn btn-red" style="font-size:11px; padding:3px 6px;" onclick="delete_event('${ev.id}')">Delete</button>
                </div>
                ${regs.length === 0 ? '<p style="font-size:11px; color:#777;">No participants registered yet.</p>' : `
                    <div style="max-height:80px; overflow-y:auto; margin-top:4px;">
                        <table style="width:100%; border-collapse:collapse; font-size:11px;">
                            <tr style="background:#eef2f7;"><th style="padding:2px;">Seat</th><th>Name</th><th>Reg No</th><th>Phone</th></tr>
                            ${regs.map(r => `<tr><td style="padding:2px;"><b>${escape_text(r.seat_number)}</b></td><td>${escape_text(r.Name)}</td><td>${escape_text(r.registration_number)}</td><td>${escape_text(r.phone_number)}</td></tr>`).join("")}
                        </table>
                    </div>
                `}
            `;
            container.appendChild(card);
        }

        function end_event(id) {
            let events = get_saved_data('events');
            let ev = events.find(e => e.id === id);
            if (ev && confirm("End this event?")) {
                ev.ended = true;
                localStorage.setItem('events', JSON.stringify(events));
                render_all_organizer_events();
            }
        }

        function delete_event(id) {
            if (confirm("Delete this event?")) {
                let events = get_saved_data('events').filter(e => e.id !== id);
                localStorage.setItem('events', JSON.stringify(events));
                let regs = get_saved_data('student_registrations').filter(s => s.event_id !== id);
                localStorage.setItem('student_registrations', JSON.stringify(regs));
                update_stats();
                render_all_organizer_events();
            }
        }

        // Set initial min date
        document.getElementById('450').min = get_today();
        document.getElementById('451').min = get_today();
    </script>
</body>
</html>
