<!--form data collection-->

function get_saved_data(storage_key){
    let saved_data= localStorage.getItem(storage_key);
    return saved_data ? JSON.parse(saved_data) : [];
}

function save_data(storage_key, form_values){
    let saved_data= get_saved_data(storage_key);
    saved_data.push(form_values);
    localStorage.setItem(storage_key, JSON.stringify(saved_data));
}

function collect_data(form_id, on_submit = null, reload_after_submit = false, storage_key = null){
    let form_data= document.getElementById(form_id);
    form_data.addEventListener('submit', function(e){
        e.preventDefault();
        let form_keys= new FormData(form_data);
        let form_values= Object.fromEntries(form_keys.entries());

        if (storage_key){
            save_data(storage_key, form_values);
        }

        if (on_submit){
            on_submit();
        } else if (reload_after_submit){
            window.location.reload();
        }
    })
}
